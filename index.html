<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蝶谱 · The Butterfly Codex</title>
<meta name="description" content="A bilingual illustrated codex of 112 butterfly taxa — morphos, swallowtails, blues, hairstreaks, metalmarks and brushfoots — with taxonomy, distribution and life-history accounts drawn from an original set of specimen plates and a 2025 supplement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#grid" data-i="skip">跳到图鉴</a>

<header class="topbar">
  <a class="brand" href="#/">
    <svg class="mark" viewBox="0 0 32 24" aria-hidden="true"><path d="M16 4.2c-2.6-3-6.7-3.6-9.9-1.7C2.4 4.7 1.2 9.6 3 13.6c1.6 3.6 5.1 6 8.9 6.2 1.7.1 3.2-.7 4.1-2.1.9 1.4 2.4 2.2 4.1 2.1 3.8-.2 7.3-2.6 8.9-6.2 1.8-4 .6-8.9-3.1-11.1C22.7.6 18.6 1.2 16 4.2Z"/></svg>
    <span class="brand-txt"><b data-i="title">蝶谱</b><i data-i="titleSub">The Butterfly Codex</i></span>
  </a>
  <div class="topbar-actions">
    <button class="text-b" id="aboutBtn" data-i="aboutBtn">关于</button>
    <div class="seg" role="group" aria-label="Language">
      <button class="seg-b" data-lang="zh">中文</button><button class="seg-b" data-lang="en">EN</button>
    </div>
    <button class="icon-b" id="themeBtn" aria-label="Theme">
      <svg viewBox="0 0 24 24" class="i-sun" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><g stroke-linecap="round"><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8"/></g></svg>
      <svg viewBox="0 0 24 24" class="i-moon" aria-hidden="true"><path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/></svg>
    </button>
  </div>
</header>

<section class="hero">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="hero-txt">
    <p class="eyebrow" data-i="eyebrow">鳞翅目 · 标本图鉴</p>
    <h1 data-i="heroH">蝶谱</h1>
    <p class="hero-lede" data-i="heroP">一百一十二个分类单元，二百二十件标本。逐条记录分类地位、模式产地、分布、生境与生活史，并附图版原注转录。</p>
    <div class="stats">
      <div class="stat"><b id="nSpecies">112</b><span data-i="sSpecies">分类单元</span></div>
      <div class="stat"><b id="nShots">220</b><span data-i="sShots">标本</span></div>
      <div class="stat"><b id="nGroups">5</b><span data-i="sGroups">科级类群</span></div>
    </div>
    <a class="cta" href="#grid" data-i="cta">开始浏览</a>
  </div>
  <div class="hero-stage" id="heroStage" aria-hidden="true"></div>
</section>

<nav class="filters" id="filters">
  <div class="filters-in">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.6"/><path d="m16 16 4.4 4.4" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" data-i-ph="ph">
      <button id="qClear" class="q-clear" hidden aria-label="Clear">&times;</button>
    </div>
    <div class="chiprow" id="groupChips" role="group" aria-label="Family"></div>
    <div class="chiprow" id="realmChips" role="group" aria-label="Realm"></div>
    <p class="count" id="count"></p>
  </div>
</nav>

<main id="grid" class="grid" tabindex="-1"></main>
<p class="empty" id="empty" hidden><span data-i="empty">没有找到匹配的蝴蝶。</span> <button id="reset" data-i="resetBtn">清除筛选</button></p>

<footer class="foot">
  <p data-i="footNote">标本图像由原始图版分离生成并去除背景；『图版原注』为图版文字的忠实转录，其余各栏为编者依一般参考资料整理。</p>
  <p><button class="link-b" id="aboutBtn2" data-i="footAbout">资料来源与说明</button></p>
  <p class="foot-dim">蝶谱 · The Butterfly Codex</p>
</footer>

<div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="detail-scrim" data-close></div>
  <article class="panel">
    <button class="close" data-close aria-label="Close">&times;</button>
    <nav class="pager">
      <button id="prev" aria-label="Previous">&#8249;</button>
      <button id="next" aria-label="Next">&#8250;</button>
    </nav>
    <div class="stage">
      <img id="dImg" alt="">
      <div class="strip" id="dStrip"></div>
    </div>
    <div class="info" id="dInfo"></div>
  </article>
</div>

<div class="detail" id="about" hidden role="dialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="detail-scrim" data-close-about></div>
  <article class="panel panel-doc">
    <button class="close" data-close-about aria-label="Close">&times;</button>
    <div class="doc" id="aboutBody"></div>
  </article>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
